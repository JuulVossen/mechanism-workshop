<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title"><title id="title">Een eerder bezoek: twee adressen</title><style>text{font-family:Georgia,serif;fill:#243a38} .line{fill:none;stroke:#3b6662;stroke-width:4} .quiet{fill:#69746c} .house{fill:#f6ead1;stroke:#675847;stroke-width:2}</style><rect width="100%" height="100%" rx="12" fill="#faf6e9"/><text x="48" y="52" font-size="15" >VERHAALDOCUMENT</text><text x="48" y="99" font-size="28" >Een eerder bezoek: twee adressen</text><path d="M48 119H852" stroke="#a59c86"/><text x="48" y="160.0" font-size="21" >De gastheer begreep het en bood een blijvende woning. De</text><text x="48" y="193.6" font-size="21" >bezoeker hield ook het adres in Rietgang actief. Bij dageraad</text><text x="48" y="227.2" font-size="21" >trok de oude verbinding de bezoeker terug. Er ontbrak geen geld</text><text x="48" y="260.8" font-size="21" >of verborgen ritueel.</text></svg>