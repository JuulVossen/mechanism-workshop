<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title"><title id="title">Uitlijningsnotitie</title><style>text{font-family:Georgia,serif;fill:#243a38} .line{fill:none;stroke:#3b6662;stroke-width:4} .quiet{fill:#69746c} .house{fill:#f6ead1;stroke:#675847;stroke-width:2}</style><rect width="100%" height="100%" rx="12" fill="#faf6e9"/><text x="48" y="52" font-size="15" >VERHAALDOCUMENT</text><text x="48" y="99" font-size="28" >Uitlijningsnotitie</text><path d="M48 119H852" stroke="#a59c86"/><text x="48" y="160.0" font-size="21" >Ada — Lijn alleen de drie onafhankelijk gecontroleerde</text><text x="48" y="193.6" font-size="21" >bouwpunten uit. Noteer het vierde als onopgelost wanneer het</text><text x="48" y="227.2" font-size="21" >afwijkt. Rek de foto niet uit. Behandel het originele houten</text><text x="48" y="260.8" font-size="21" >raam voorzichtig; een scan is een bron, geen vervanging voor het</text><text x="48" y="294.4" font-size="21" >voorwerp. — Ruben</text></svg>