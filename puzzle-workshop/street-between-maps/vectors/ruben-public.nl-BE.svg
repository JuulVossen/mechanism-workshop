<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title"><title id="title">Ruben spreekt met toestemming</title><style>text{font-family:Georgia,serif;fill:#243a38} .line{fill:none;stroke:#3b6662;stroke-width:4} .quiet{fill:#69746c} .house{fill:#f6ead1;stroke:#675847;stroke-width:2}</style><rect width="100%" height="100%" rx="12" fill="#faf6e9"/><text x="48" y="52" font-size="15" >VERHAALDOCUMENT</text><text x="48" y="99" font-size="28" >Ruben spreekt met toestemming</text><path d="M48 119H852" stroke="#a59c86"/><text x="48" y="160.0" font-size="21" >Met mijn toestemming mag de raad haar naam kennen: Sofie. Ik</text><text x="48" y="193.6" font-size="21" >voltooide de omtrek terwijl zij in de overeenkomstige kamer was.</text><text x="48" y="227.2" font-size="21" >Ze verdween toen die veranderde. Ik verzweeg dat verlies.</text><text x="48" y="260.8" font-size="21" >Vandaag verplicht het bewijs me de mensen te helpen die nog</text><text x="48" y="294.4" font-size="21" >kunnen vertrekken.</text></svg>