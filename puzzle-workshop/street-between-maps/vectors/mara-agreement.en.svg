<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title"><title id="title">Mara’s agreement</title><style>text{font-family:Georgia,serif;fill:#243a38} .line{fill:none;stroke:#3b6662;stroke-width:4} .quiet{fill:#69746c} .house{fill:#f6ead1;stroke:#675847;stroke-width:2}</style><rect width="100%" height="100%" rx="12" fill="#faf6e9"/><text x="48" y="52" font-size="15" >STORY DOCUMENT</text><text x="48" y="99" font-size="28" >Mara’s agreement</text><path d="M48 119H852" stroke="#a59c86"/><text x="48" y="160.0" font-size="21" >I have heard Nelle’s choice and Lena’s invitation. I agree to</text><text x="48" y="193.6" font-size="21" >this trial with them. We will not treat its result as consent</text><text x="48" y="227.2" font-size="21" >from another household.</text></svg>