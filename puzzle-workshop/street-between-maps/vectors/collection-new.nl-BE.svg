<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title"><title id="title">Zadenverzameling Aan het Water</title><style>text{font-family:Georgia,serif;fill:#243a38} .line{fill:none;stroke:#3b6662;stroke-width:4} .quiet{fill:#69746c} .house{fill:#f6ead1;stroke:#675847;stroke-width:2}</style><rect width="100%" height="100%" rx="12" fill="#faf6e9"/><text x="48" y="52" font-size="15" >VERHAALDOCUMENT</text><text x="48" y="99" font-size="28" >Zadenverzameling Aan het Water</text><path d="M48 119H852" stroke="#a59c86"/><text x="48" y="160.0" font-size="21" >Verzameling RG-SEED-01. Latere tuin aan de overkant van de</text><text x="48" y="193.6" font-size="21" >Kapucijnenvoer. Nieuwe plaats, dezelfde verzameling. Verzonnen</text><text x="48" y="227.2" font-size="21" >etiket; geen verhuisdatum vastgesteld.</text></svg>